<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daniel Padilha — Vamos conversar?</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#191919">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,700;1,400&family=Ubuntu:wght@700&display=swap" rel="stylesheet">

<style>
:root{--fundo:#f4f4f2;--bolha:#ffffff;--texto:#1c1c1a;--mudo:#8a8a86;--verde:#598E71;--laranja:#DE8031;--laranja2:#c96f24;--vermelho:#cf5148}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--fundo);color:var(--texto);font-family:'Noto Sans',sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
b{color:#000}
em{font-style:italic}
.chat{max-width:640px;margin:0 auto;padding:30px 16px 60px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:flex-end;align-self:flex-start;max-width:88%}
.ava{width:38px;height:38px;border-radius:50%;flex-shrink:0;object-fit:cover;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.ava.oculto{visibility:hidden}
.bolha{background:var(--bolha);border-radius:6px 18px 18px 18px;padding:12px 16px;box-shadow:0 1px 3px rgba(0,0,0,.09);animation:surge .25s ease}
.bolha.vermelha,.bolha.vermelha b{color:var(--vermelho)}
.resp{background:var(--verde);color:#fff;border-radius:18px 6px 18px 18px;padding:12px 16px;max-width:85%;align-self:flex-end;box-shadow:0 1px 3px rgba(0,0,0,.10);animation:surge .25s ease}
@keyframes surge{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.digitando{display:inline-flex;gap:5px;padding:14px 18px;background:var(--bolha);border-radius:6px 18px 18px 18px;box-shadow:0 1px 3px rgba(0,0,0,.09)}
.digitando span{width:7px;height:7px;border-radius:50%;background:#b5b5b1;animation:pisca 1s infinite}
.digitando span:nth-child(2){animation-delay:.2s}
.digitando span:nth-child(3){animation-delay:.4s}
@keyframes pisca{0%,100%{opacity:.3}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.opcoes{display:flex;flex-wrap:wrap;gap:10px;align-self:flex-start;max-width:100%;padding-left:48px}
.op{font-family:'Noto Sans',sans-serif;font-size:.98rem;color:#fff;background:var(--laranja);border:none;border-radius:14px;padding:11px 17px;cursor:pointer;text-align:left;transition:background .15s;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.op:hover{background:var(--laranja2)}
.op.multi.on{background:#a8541a;box-shadow:inset 0 0 0 2px #fff3}
.entrada-inline{display:flex;flex-direction:column;gap:6px;align-self:flex-end;align-items:flex-end;max-width:88%;animation:surge .25s ease}
.entrada-inline .linha{display:flex;gap:10px}
.campo{background:#fff;border:1px solid #ddddd9;border-radius:12px;color:var(--texto);font-family:inherit;font-size:1rem;padding:12px 14px;outline:none;min-width:240px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
textarea.campo{min-width:300px;height:76px;resize:none}
.campo:focus{border-color:#F2C230}
.btn{font-family:'Ubuntu',sans-serif;font-weight:700;font-size:1rem;color:#2a2313;background:#F2C230;border:none;border-radius:13px;padding:12px 24px;cursor:pointer;transition:background .15s}
.btn:hover{background:#dfae1b}
.barra-enviar{align-self:flex-start;padding-left:48px;margin-top:2px}
.btn-multi{min-width:180px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.aviso-erro{color:var(--vermelho);font-size:.85rem;display:none}
audio{width:230px;height:40px;align-self:flex-start;margin:-2px 0 0 48px}
</style>
</head>

YBFkR2PrDoq1V1oyfTq7YLiTm6/1i6fOXT3TG1d2ez7e2xvitP4YLftPM8fTPCAiiC0m5RIvL/AphqqAdB2ivNAAAAAElFTkSuQmCC';
const R = {};        // respostas
let passo = 0;

const espera = ms => new Promise(r => setTimeout(r, ms));
function rolar(){ window.scrollTo({top: document.body.scrollHeight, behavior:'smooth'}); }

function bolha(html, classe){
  const ant = chat.querySelector('.row:last-of-type .ava:not(.oculto)');
  if (ant && chat.lastElementChild && chat.lastElementChild.classList.contains('row')) ant.classList.add('oculto');
  const row = document.createElement('div'); row.className = 'row';
  const img = document.createElement('img'); img.className = 'ava'; img.src = AVATAR; img.alt = 'Daniel Padilha';
  const d = document.createElement('div'); d.className = 'bolha' + (classe ? ' ' + classe : ''); d.innerHTML = html;
  row.append(img, d); chat.appendChild(row); rolar(); }
function resposta(txt){ const d = document.createElement('div'); d.className = 'resp'; d.textContent = txt; chat.appendChild(d); rolar(); }
async function digita(ms){ const row = document.createElement('div'); row.className = 'row'; const img = document.createElement('img'); img.className = 'ava oculto'; img.src = AVATAR; img.alt=''; const d = document.createElement('div'); d.className = 'digitando'; d.innerHTML = '<span></span><span></span><span></span>'; row.append(img, d); chat.appendChild(row); rolar(); await espera(ms); row.remove(); }


function pedirTexto(ph, tipo, longo){ return new Promise(res => {
  const wrap = document.createElement('div'); wrap.className = 'entrada-inline';
  const linha = document.createElement('div'); linha.className = 'linha';
  const campo = document.createElement(longo ? 'textarea' : 'input');
  if (!longo) campo.type = tipo || 'text';
  campo.placeholder = ph; campo.className = 'campo';
  const btn = document.createElement('button'); btn.className = 'btn'; btn.textContent = 'Enviar';
  const err = document.createElement('p'); err.className = 'aviso-erro';
  const mostraErro = m => { err.textContent = m; err.style.display = 'block'; };
  const envia = () => {
    const v = campo.value.trim();
    if (!v) return mostraErro('Escreve aí rapidinho antes de enviar.');
    if (tipo === 'email' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) return mostraErro('Confere o e-mail? Parece incompleto.');
    if (tipo === 'tel' && v.replace(/\D/g,'').length < 10) return mostraErro('Coloca o número com DDD, por favor.');
    wrap.remove(); res(v);
  };
  btn.addEventListener('click', envia);
  campo.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); envia(); } });
  linha.append(campo, btn); wrap.append(linha, err); chat.appendChild(wrap); campo.focus(); rolar();
});}

function pedirBotoes(ops){ return new Promise(res => {
  const box = document.createElement('div'); box.className = 'opcoes';
  ops.forEach(o => { const b = document.createElement('button'); b.className = 'op'; b.textContent = o;
    b.addEventListener('click', () => { box.remove(); res(o); }); box.appendChild(b); });
  chat.appendChild(box); rolar();
});}

function pedirMulti(ops){ return new Promise(res => {
  const box = document.createElement('div'); box.className = 'opcoes';
  const marcados = new Set();
  const ok = document.createElement('button'); ok.className = 'btn btn-multi'; ok.textContent = 'Enviar'; ok.disabled = true;
  ops.forEach(o => { const b = document.createElement('button'); b.className = 'op multi'; b.textContent = o;
    b.addEventListener('click', () => { b.classList.toggle('on'); marcados.has(o) ? marcados.delete(o) : marcados.add(o); ok.disabled = !marcados.size; }); box.appendChild(b); });
  const barra = document.createElement('div'); barra.className = 'barra-enviar'; barra.appendChild(ok);
  ok.addEventListener('click', () => { box.remove(); barra.remove(); res([...marcados].join(', ')); });
  chat.append(box, barra); rolar();
});}

async function roda(){
  for (const p of FLUXO){
    if (p.se && R[p.se.id] !== p.se.igual) continue;
    if (p.t === 'msg'){ await digita(900); bolha(p.txt, p.classe); await espera(350); continue; }
    if (p.t === 'msgNome'){ await digita(700); bolha('Perfeito, <b>' + (R.nome || '') + '</b>!'); await espera(350); continue; }
    await digita(1000); bolha(p.txt, p.classe);
    if (p.audio) { const a = document.createElement('audio'); a.controls = true; a.src = p.audio; chat.appendChild(a); rolar(); }
    let v;
    if (p.t === 'botoes') v = await pedirBotoes(p.ops);
    else if (p.t === 'multi') v = await pedirMulti(p.ops);
    else if (p.t === 'texto') v = await pedirTexto(p.ph, 'text', false);
    else if (p.t === 'textoLongo') v = await pedirTexto(p.ph, 'text', true);
    else if (p.t === 'tel') v = await pedirTexto(p.ph, 'tel', false);
    else if (p.t === 'email') v = await pedirTexto(p.ph, 'email', false);
    else if (p.t === 'final'){
      const clicou = await pedirBotoes([p.botao]);
      resposta(clicou); await digita(800); bolha('Fechado. Te levando pro meu WhatsApp agora…');
      await finaliza(); return;
    }
    R[p.id] = v; resposta(v); await espera(300);
  }
}

async function finaliza(){
  const resumo = [
    'Oi Daniel! Acabei de preencher o formulário da carta.',
    'Nome: ' + (R.nome || ''),
    'Área/tese: ' + (R.area || ''),
    'Momento: ' + (R.momento || ''),
    'Investe em anúncio: ' + (R.trafego || '') + (R.investimento ? ' (' + R.investimento + ')' : ''),
    'Maior gargalo: ' + (R.gargalo || '')
  ].join('\n');
  if (WEBHOOK_URL){ try { await fetch(WEBHOOK_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({origem:'carta-pongui', data: new Date().toISOString(), respostas: R})}); } catch(e){} }
  location.href = 'https://wa.me/' + WA_NUMERO + '?text=' + encodeURIComponent(resumo);
}

roda();
</script>
